<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="seqBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#38bdf8"/>
    </marker>
    <marker id="seqGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#34d399"/>
    </marker>
    <marker id="seqRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#f87171"/>
    </marker>
    <marker id="seqAmber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#0a1128"/>
  <text x="64" y="64" fill="#f8fafc" font-size="32" font-weight="700">Least-Privilege Joiner Sequence: AI SoD Gate, Abstention &amp; Graph v1.0 Execution</text>
  <text x="64" y="96" fill="#94a3b8" font-size="18">Deterministic Hard Vetoes Execute Prior to AI Scoring and Before Any Entitlement Mutation</text>

  <!-- Lifelines -->
  <g stroke="#334155" stroke-width="2" stroke-dasharray="8 6">
    <line x1="170" y1="205" x2="170" y2="995"/>
    <line x1="490" y1="205" x2="490" y2="995"/>
    <line x1="830" y1="205" x2="830" y2="995"/>
    <line x1="1170" y1="205" x2="1170" y2="995"/>
    <line x1="1490" y1="205" x2="1490" y2="995"/>
    <line x1="1760" y1="205" x2="1760" y2="995"/>
  </g>

  <!-- Actor Boxes -->
  <rect x="70" y="135" width="200" height="68" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="170" y="175" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Workday HRIS</text>

  <rect x="375" y="135" width="230" height="68" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <text x="490" y="166" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Entra Lifecycle</text>
  <text x="490" y="188" text-anchor="middle" fill="#cbd5e1" font-size="13">Workflow (T-24h)</text>

  <rect x="715" y="135" width="230" height="68" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="830" y="166" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">AI SoD Advisor</text>
  <text x="830" y="188" text-anchor="middle" fill="#cbd5e1" font-size="13">PowerShell 7.4</text>

  <rect x="1060" y="135" width="220" height="68" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="1170" y="166" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Azure AI Foundry</text>
  <text x="1170" y="188" text-anchor="middle" fill="#cbd5e1" font-size="13">JSON Critique</text>

  <rect x="1375" y="135" width="230" height="68" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="1490" y="166" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Graph v1.0</text>
  <text x="1490" y="188" text-anchor="middle" fill="#cbd5e1" font-size="13">Entitlement Mgmt</text>

  <rect x="1660" y="135" width="200" height="68" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="1760" y="166" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">IAM Reviewer</text>
  <text x="1760" y="188" text-anchor="middle" fill="#cbd5e1" font-size="13">Human Escalation</text>

  <!-- Step 1 -->
  <line x1="170" y1="255" x2="484" y2="255" stroke="#38bdf8" stroke-width="3" marker-end="url(#seqBlue)"/>
  <text x="200" y="244" fill="#e2e8f0" font-size="15">1. Joiner Hire Event (JobCode, Department, RequestedRoles)</text>

  <!-- Step 2 -->
  <line x1="490" y1="315" x2="824" y2="315" stroke="#38bdf8" stroke-width="3" marker-end="url(#seqBlue)"/>
  <text x="515" y="304" fill="#e2e8f0" font-size="15">2. Custom Task Extension Webhook (OAuth2)</text>

  <!-- Step 3 -->
  <rect x="740" y="345" width="180" height="58" rx="6" fill="#1e293b" stroke="#f87171"/>
  <text x="830" y="370" text-anchor="middle" fill="#f87171" font-size="14" font-weight="700">3. Hard Veto Check</text>
  <text x="830" y="390" text-anchor="middle" fill="#cbd5e1" font-size="12">Tier0 / CA-Exclude / Toxic Pair</text>

  <!-- Step 4 -->
  <line x1="830" y1="435" x2="1164" y2="435" stroke="#a78bfa" stroke-width="3" marker-end="url(#seqBlue)"/>
  <text x="860" y="424" fill="#e2e8f0" font-size="15">4. Peer-Baseline + Untrusted Role Payload (temp=0.0)</text>

  <line x1="1170" y1="485" x2="836" y2="485" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#seqBlue)"/>
  <text x="875" y="474" fill="#cbd5e1" font-size="14">5. Structured JSON (Confidence, RiskSummary)</text>

  <!-- Decision Frame A: Approve -->
  <rect x="440" y="530" width="1120" height="125" rx="10" fill="#064e3b" fill-opacity="0.28" stroke="#34d399" stroke-width="2"/>
  <text x="460" y="558" fill="#34d399" font-size="16" font-weight="700">Path A: APPROVE_AU_SCOPED (Confidence &gt;= 0.75 &amp; AnomalyScore &lt; 0.65 &amp; Zero Toxic Pairs)</text>
  <line x1="830" y1="585" x2="496" y2="585" stroke="#34d399" stroke-width="3" marker-end="url(#seqGreen)"/>
  <text x="530" y="576" fill="#d1fae5" font-size="14">6a. Return Permitted = true + RecommendedAccessPackages</text>
  <line x1="490" y1="628" x2="1484" y2="628" stroke="#34d399" stroke-width="3" marker-end="url(#seqGreen)"/>
  <text x="640" y="618" fill="#d1fae5" font-size="14">6b. POST /identityGovernance/entitlementManagement/assignmentRequests (Restricted AU)</text>

  <!-- Decision Frame B: Veto / Hold -->
  <rect x="440" y="680" width="1380" height="125" rx="10" fill="#7f1d1d" fill-opacity="0.28" stroke="#f87171" stroke-width="2"/>
  <text x="460" y="708" fill="#f87171" font-size="16" font-weight="700">Path B: VETO_SOD_TOXIC_COMBINATION or HOLD_PEER_ANOMALY (Permitted = false)</text>
  <line x1="830" y1="742" x2="496" y2="742" stroke="#f87171" stroke-width="3" marker-end="url(#seqRed)"/>
  <text x="515" y="732" fill="#fee2e2" font-size="14">7a. Fail-Closed Workflow Halt (continueOnError = false)</text>
  <line x1="830" y1="780" x2="1754" y2="780" stroke="#f87171" stroke-width="3" marker-end="url(#seqRed)"/>
  <text x="1060" y="770" fill="#fee2e2" font-size="14">7b. Emit ToxicPairsDetected / OutlierRoles to IAM Escalation Queue</text>

  <!-- Decision Frame C: Abstain -->
  <rect x="440" y="830" width="1380" height="115" rx="10" fill="#78350f" fill-opacity="0.28" stroke="#fbbf24" stroke-width="2"/>
  <text x="460" y="858" fill="#fbbf24" font-size="16" font-weight="700">Path C: ABSTAIN_LOW_CONFIDENCE (Unmapped JobCode or Confidence &lt; 0.75)</text>
  <line x1="830" y1="905" x2="1754" y2="905" stroke="#fbbf24" stroke-width="3" marker-end="url(#seqAmber)"/>
  <text x="1030" y="895" fill="#fef3c7" font-size="14">8. Abstain &amp; Route to Human IAM Reviewer (Zero Autonomous Assignment)</text>
</svg>
