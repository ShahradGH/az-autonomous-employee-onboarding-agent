  <text x="394" y="244" fill="#38bdf8" font-size="13">HTTPS/SCIM</text>

  <line x1="700" y1="304" x2="700" y2="324" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="900" y1="370" x2="1046" y2="290" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrowAmber)"/>
  <text x="920" y="316" fill="#fbbf24" font-size="13">Webhook (~120ms)</text>

  <line x1="1420" y1="288" x2="1452" y2="288" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="1640" y1="360" x2="1640" y2="388" stroke="#64748b" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="1456" y1="470" x2="1424" y2="470" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <line x1="1050" y1="510" x2="904" y2="472" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="912" y="514" fill="#34d399" font-size="13">APPROVE_AU_SCOPED</text>

  <line x1="700" y1="512" x2="700" y2="708" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="712" y="615" fill="#34d399" font-size="13">Graph v1.0 Assignment</text>

  <line x1="1235" y1="567" x2="1235" y2="710" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowBlue)"/>
  <line x1="1235" y1="567" x2="750" y2="858" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
</svg>
